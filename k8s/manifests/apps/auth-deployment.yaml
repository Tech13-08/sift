apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
          - name: wait-for-postgres
            image: alpine:latest
            command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
          - name: wait-for-redis
            image: alpine:latest
            command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done;']
      containers:
        - name: auth-service
          image: sift-auth:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: sift-config
                  key: AUTH_HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: sift-config
                  key: AUTH_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: SESSION_SECRET
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: TOKEN_ENCRYPTION_KEY
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: DISCORD_BOT_TOKEN
            - name: AUTH_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: sift-config
                  key: AUTH_PUBLIC_URL
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: sift-config
                  key: DISCORD_REDIRECT_URI
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: sift-config
                  key: GOOGLE_REDIRECT_URI
            - name: GOOGLE_PUBSUB_TOPIC
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: GOOGLE_PUBSUB_TOPIC
            - name: WATCH_RENEW_BEFORE_MS
              valueFrom:
                configMapKeyRef:
                  name: sift-config
                  key: WATCH_RENEW_BEFORE_MS
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: sift-config
                  key: REDIS_ADDR
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 3000
      targetPort: 3000
