apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.1
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sift-secrets
                  key: CF_TUNNEL_TOKEN
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 256Mi
          livenessProbe:
            exec:
              command: ["cloudflared", "version"]
            initialDelaySeconds: 20
            periodSeconds: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-origin-hint
  labels:
    app: cloudflared
data:
  ORIGIN: http://traefik.kube-system.svc.cluster.local:80
