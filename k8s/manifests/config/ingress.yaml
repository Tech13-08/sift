apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sift-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3000
      - path: /webhooks/gmail
        pathType: Prefix
        backend:
          service:
            name: ingestion-service 
            port:
              number: 8080