apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sift-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /webhooks/gmail
            pathType: Prefix
            backend:
              service:
                name: ingestion-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
