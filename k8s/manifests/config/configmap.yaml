apiVersion: v1
kind: ConfigMap
metadata:
  name: sift-config
  labels:
    app: sift
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: sift
  DB_USER: postgres
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_ADDR: redis:6379
  AUTH_PORT: "3000"
  AUTH_HOST: "0.0.0.0"
  INGESTION_PORT: "8080"
  SUMMARIZER_HEALTH_PORT: "8090"
  WATCH_RENEW_BEFORE_MS: "86400000"
  DISCORD_REDIRECT_URI: http://localhost:3000/auth/discord/callback
  GOOGLE_REDIRECT_URI: http://localhost:3000/auth/google/callback
  AUTH_PUBLIC_URL: http://localhost:3000
