apiVersion: v1
kind: Secret
metadata:
  name: sift-secrets
type: Opaque
stringData:
  DB_PASSWORD: change-me
  DATABASE_URL: postgres://postgres:change-me@postgres:5432/sift?sslmode=disable
  SESSION_SECRET: change-me
  TOKEN_ENCRYPTION_KEY: replace-with-64-hex-chars
  WEBHOOK_SECRET: change-me
  DISCORD_CLIENT_ID: your-discord-client-id
  DISCORD_CLIENT_SECRET: change-me
  DISCORD_BOT_TOKEN: change-me
  GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: change-me
  GOOGLE_PUBSUB_TOPIC: projects/YOUR_GCP_PROJECT/topics/YOUR_TOPIC
  CF_TUNNEL_TOKEN: change-me
