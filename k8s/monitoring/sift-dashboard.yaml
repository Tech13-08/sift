              "expr": "kube_deployment_status_replicas_ready{namespace=\"default\",deployment=\"ingestion-service\"}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
