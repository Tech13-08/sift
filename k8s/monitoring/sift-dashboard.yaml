                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "DOWN"
            }
          }
        },
        {
          "id": 6,
          "title": "Tunnel",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"default\",deployment=\"cloudflared\"}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "DOWN"
            }
          }
        },
        {
          "id": 7,
          "title": "Postgres",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "pg_up",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "DOWN"
            }
          }
        },
        {
          "id": 8,
          "title": "Redis",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "redis_up",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "DOWN"
            }
          }
        },
        {
          "id": 9,
          "title": "Services ready",
          "description": "How many of the 8 Sift deployments are ready (want 8).",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "count(kube_deployment_status_replicas_ready{namespace=\"default\",deployment=~\"auth-service|web-service|ingestion-service|summarizer-service|discord-service|postgres|redis|cloudflared\"} == 1)",
              "refId": "A",
              "legendFormat": "ready"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "max": 8,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "green",
                    "value": 8
                  }
                ]
              },
              "displayName": "of 8 ready"
            }
          }
        },
        {
          "id": 10,
          "title": "Pod restarts (24h)",
          "description": "Total container restarts across Sift pods. Spikes after a host reboot are normal; a climbing line while the host is stable is not.",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"default\",pod=~\"auth-service.*|web-service.*|ingestion-service.*|summarizer-service.*|discord-service.*|postgres.*|redis.*|cloudflared.*\"}[24h]))",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            }
          }
        },
        {
          "id": 11,
          "title": "Postgres connections",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(pg_stat_activity_count{datname=\"sift\"})",
              "refId": "A",
              "legendFormat": "open"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "displayName": "open",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            }
          }
        },
        {
          "id": 12,
          "title": "Redis clients",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "redis_connected_clients",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "displayName": "connected",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            }
          }
        },
        {
          "id": 13,
          "title": "App memory (all Sift pods)",
          "description": "Working-set memory for every Sift container, summed. Quiet apps sit low and flat.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",container!=\"\",container!=\"POD\",pod=~\"auth-service.*|web-service.*|ingestion-service.*|summarizer-service.*|discord-service.*|postgres.*|redis.*|cloudflared.*\"})",
              "legendFormat": "total",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "hidden",
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          }
        },
        {
          "id": 14,
          "title": "Host load (k3d node)",
          "description": "CPU and memory pressure on the single k3d node (includes Docker Desktop / other containers on the host).",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "CPU %",
              "refId": "A"
            },
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
              "legendFormat": "RAM %",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          }
        },
        {
          "type": "row",
          "title": "Live product activity",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 30,
          "title": "Actions (24h)",
          "type": "table",
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "label_replace(sum(increase(sift_user_actions_total{action=\"signup\"}[24h])) or vector(0), \"action\", \"Signups\", \"\", \"\") or label_replace(sum(increase(sift_user_actions_total{action=\"gmail_linked\"}[24h])) or vector(0), \"action\", \"Gmail linked\", \"\", \"\") or label_replace(sum(increase(sift_user_actions_total{action=\"gmail_unlinked\"}[24h])) or vector(0), \"action\", \"Gmail unlinked\", \"\", \"\") or label_replace(sum(increase(sift_user_actions_total{action=\"discord_linked\"}[24h])) or vector(0), \"action\", \"Discord linked\", \"\", \"\") or label_replace(sum(increase(sift_user_actions_total{action=\"discord_unlinked\"}[24h])) or vector(0), \"action\", \"Discord unlinked\", \"\", \"\") or label_replace(sum(increase(sift_user_actions_total{action=\"contact_email_changed\"}[24h])) or vector(0), \"action\", \"Contact email changed\", \"\", \"\") or label_replace(sum(increase(sift_user_actions_total{action=\"account_deleted\"}[24h])) or vector(0), \"action\", \"Deletes\", \"\", \"\")",
              "legendFormat": "{{action}}",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "namespace": true,
                  "service": true,
                  "endpoint": true,
                  "pod": true,
                  "container": true
                },
                "renameByName": {
                  "action": "Action",
                  "Value": "Count"
                },
                "indexByName": {
                  "Action": 0,
                  "Count": 1
                }
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": []
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "filterable": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Count"
                },
                "properties": [
                  {
                    "id": "custom.align",
                    "value": "right"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 40,
          "title": "Activity rate (last 3h)",
          "description": "Events per minute by action type.",
          "type": "timeseries",
          "gridPos": {
            "h": 10,
            "w": 16,
            "x": 8,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(sift_user_actions_total{action=\"signup\"}[5m]) * 60) or vector(0)",
              "legendFormat": "Signups",
              "refId": "A"
            },
            {
              "expr": "sum(rate(sift_user_actions_total{action=\"gmail_linked\"}[5m]) * 60) or vector(0)",
              "legendFormat": "Gmail linked",
              "refId": "B"
            },
            {
              "expr": "sum(rate(sift_user_actions_total{action=\"gmail_unlinked\"}[5m]) * 60) or vector(0)",
              "legendFormat": "Gmail unlinked",
              "refId": "C"
            },
            {
              "expr": "sum(rate(sift_user_actions_total{action=\"discord_linked\"}[5m]) * 60) or vector(0)",
              "legendFormat": "Discord linked",
              "refId": "D"
            },
            {
              "expr": "sum(rate(sift_user_actions_total{action=\"discord_unlinked\"}[5m]) * 60) or vector(0)",
              "legendFormat": "Discord unlinked",
              "refId": "E"
            },
            {
              "expr": "sum(rate(sift_user_actions_total{action=\"contact_email_changed\"}[5m]) * 60) or vector(0)",
              "legendFormat": "Contact email changed",
              "refId": "F"
