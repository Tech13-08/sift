# Single public dashboard: glanceable status tiles + a few quiet sparklines.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sift-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sift-cluster-health.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [
        {
          "title": "Open Sift app",
          "type": "link",
          "icon": "external link",
          "url": "https://sift.falaktulsi.com",
          "targetBlank": true,
          "tooltip": "Try the live Sift UI"
        }
      ],
      "panels": [
        {
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "## Sift \u00b7 live cluster\n**[Open the Sift app \u2192](https://sift.falaktulsi.com)** \u00b7 Green tiles = service up. Scroll down for **live product activity** (signups, Gmail/Discord link/unlink, etc. - counts only, no personal data)."
          }
        },
        {
          "id": 1,
          "title": "Web",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"default\",deployment=\"web-service\"}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "DOWN"
            }
          }
        },
        {
          "id": 2,
          "title": "Auth",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"default\",deployment=\"auth-service\"}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "DOWN"
            }
          }
        },
        {
          "id": 3,
          "title": "Ingestion",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
